schema_version: 1

context:
  name: pymatgen-core
  version: "2026.4.16"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pymatgen_core-${{ version }}.tar.gz
  sha256: 7b5f00ce7c6ae6d77eb79ab1d7f71609a639dbd9639d299cc3a9e1fac65adaf6

build:
  number: 1
  skip: match(python, "<=3.10")
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: cython
    - if: build_platform != target_platform
      then: numpy
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - cython >=0.29.23
    - numpy >=2.1.0
    - setuptools >=65.0.0
    - pip
  run:
    - lxml >=4.9
    - python
    - matplotlib-base >=3.8
    - monty >=2026.2.18
    - networkx >=2.7
    - orjson >=3.10,<4
    - palettable >=3.3.3
    - pandas >=2
    - scipy >=1.13.0
    - if: win
      then: scipy >=1.14.1
    - spglib >=2.5
    - sympy >=1.3
    - uncertainties >=3.1
    - plotly >=6.0
    - joblib >=1.3.2
    - bibtexparser
    - tabulate >=0.9.0
    - tqdm >=4.67.3
    - requests >=2.32.5
    - numpy

tests:
  - python:
      imports:
        - pymatgen
      pip_check: true

about:
  summary: Python Materials Genomics is a robust materials analysis code that defines core object representations for structures
  license: MIT
  license_file: LICENSE
  homepage: https://pymatgen.org

extra:
  recipe-maintainers:
    - jan-janssen
